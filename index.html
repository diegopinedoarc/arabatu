<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arabatu Bloco</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <!-- Navbar Menu -->
    <header class="header">
      <a href="./index.html"
        ><img src="./assets/images/logo.png" alt="logo" class="logo"
      /></a>

      <nav class="navbar">
        <input type="checkbox" id="toggle-menu" />
        <label for="toggle-menu" class="bars-menu">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <ul class="navbar-list">
          <li><a href="./index.html" class="navbar-link">Inicio</a></li>
          <li><a href="./about.html" class="navbar-link">Conócenos</a></li>
          <li>
            <a
              href="https://www.instagram.com/arabatu.bloco/"
              class="navbar-link"
              >Contacto</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero">
        <img src="./assets/images/hero.jpg" alt="img-hero" class="img-hero" />
        <div class="hero-info">
          <div class="hero-tittle">
            <h1 class="tittle">Arabatu Bloco</h1>
          </div>
        </div>
      </section>
      <section class="CTA">
        <div class="card-CTA">
          <div class="card-header">
            <p>El tambor nos une</p>
            <p>Nos mueve</p>
            <p>Nos transforma</p>
          </div>
          <div class="card-eventos">
            <h3>¿Queres llevar el ritmo a tu evento?</h3>
            <p>¡Escribinos a nuestro instagram!</p>
            <div class="cta-container">
              <h2>Arabatu #ModoShow</h2>
              <a href="https://www.instagram.com/arabatu.bloco/">
                <button class="cta-button">
                  ¡Escribinos!
                  <img
                    src="./assets/images/vecteezy_instagram-logo-png-instagram-logo-transparent-png_23986502.png"
                    alt=""
                    class="logo-ig"
                  />
                </button>
              </a>
            </div>
          </div>
        </div>
      </section>
      <section class="galeria">
        <div class="container-galeria">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
        </div>
        <div class="video">
          <h3 class="info-h2">¡Cierre de año!</h3>
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/oqkrgo8vwfQ?si=-5Cthzh87Myb5lbx"
            title="YouTube video player"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>
    <footer>
      <a href="./index.html"
        ><img src="./assets/images/logo.png" alt="logo" class="logo-footer"
      /></a>
      <a href="https://www.instagram.com/arabatu.bloco/"
        ><img
          src="./assets/images/vecteezy_instagram-logo-png-instagram-logo-transparent-png_23986502.png"
          class="logo-ig"
          alt="logo-ig"
      /></a>
    </footer>
  </body>
</html>
