<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="robots" content="noindex" />
    <title>Sala de Estudio · Arabatu Bloco</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./sala/sala.css" />
  </head>
  <body>
    <div id="loading-screen">
      <img src="./assets/images/logo.png" alt="Arabatu" />
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <!-- MENÚ LATERAL (escritorio) -->
    <aside class="sidebar">
      <a class="brand" href="./index.html" aria-label="Arabatu Bloco, ir al inicio"><img src="./assets/images/logo.png" alt="Arabatu Bloco" /></a>
      <nav class="nav-list" aria-label="Secciones">
        <button class="nav-link active" data-tipo="audio"><span data-icon="note"></span>Audios</button>
        <button class="nav-link" data-tipo="video"><span data-icon="film"></span>Videos</button>
        <a class="nav-link" href="./prode.html"><span data-icon="trophy"></span>Prode Mundial 2026</a>
        <a class="nav-link caja-only" href="./caja.html" hidden><span data-icon="cash"></span>Control Caja</a>
        <a class="nav-link admin-only" href="./sala-admin.html" hidden><span data-icon="shield"></span>Administrar</a>
      </nav>
      <div class="side-foot">
        <div class="user-chip" id="user-chip"></div>
        <button class="btn btn-ghost btn-sm" data-logout type="button">Salir</button>
      </div>
    </aside>

    <!-- BARRA SUPERIOR (celular) -->
    <header class="mobile-top">
      <a class="brand" href="./index.html" aria-label="Arabatu Bloco, ir al inicio"><img src="./assets/images/logo.png" alt="Arabatu Bloco" /></a>
      <button class="btn btn-ghost btn-sm" data-logout type="button">Salir</button>
    </header>

    <main class="main">
      <section class="hero">
        <span class="eyebrow">Zona exclusiva · Miembros</span>
        <h1 id="hero-title">Audios</h1>
        <p id="hero-sub"></p>
      </section>

      <div class="toolbar">
        <div class="search-wrap">
          <span data-icon="search"></span>
          <input class="input" id="q" type="search" placeholder="Buscar por título…" autocomplete="off" />
        </div>
        <select class="select" id="inst-select" aria-label="Filtrar por instrumento"></select>
        <button class="btn btn-ghost btn-sm" id="btn-clear" type="button" hidden>Limpiar</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por guion"></div>
      <div class="results-line" id="results-line"></div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>

      <p class="sala-footer">Material exclusivo para miembros · No compartir externamente</p>
    </main>

    <!-- Panel del reproductor real (YouTube / Drive) -->
    <div class="stage" id="stage">
      <div class="stage-head">
        <span id="stage-label">YouTube</span>
        <button class="btn-icon" id="stage-close" type="button" aria-label="Cerrar reproductor" data-icon="close"></button>
      </div>
      <div class="stage-frame">
        <div id="yt-host"></div>
        <iframe id="drive-frame" hidden allow="autoplay" title="Reproductor de Google Drive"></iframe>
      </div>
    </div>

    <!-- REPRODUCTOR FIJO -->
    <div class="player" id="player" role="region" aria-label="Reproductor">
      <div class="player-info">
        <img class="player-cover" id="pl-cover" src="./assets/images/logo.png" alt="" />
        <div class="player-text">
          <div class="player-title" id="pl-title"></div>
          <div class="player-sub" id="pl-sub"></div>
        </div>
      </div>
      <div class="player-center">
        <div class="player-controls">
          <button class="pbtn" id="pl-prev" type="button" aria-label="Anterior"></button>
          <button class="pbtn play" id="pl-play" type="button" aria-label="Reproducir"></button>
          <button class="pbtn" id="pl-next" type="button" aria-label="Siguiente"></button>
        </div>
        <div class="progress-row">
          <span class="time" id="pl-cur">0:00</span>
          <input type="range" id="pl-seek" min="0" max="0" step="0.1" value="0" aria-label="Progreso" />
          <span class="time r" id="pl-dur">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <span class="time">Vol</span>
        <input type="range" id="pl-vol" min="0" max="100" value="80" aria-label="Volumen" />
      </div>
    </div>

    <!-- BARRA INFERIOR (celular) -->
    <nav class="bottom-nav" aria-label="Secciones">
      <button class="nav-link active" data-tipo="audio"><span data-icon="note"></span>Audios</button>
      <button class="nav-link" data-tipo="video"><span data-icon="film"></span>Videos</button>
      <a class="nav-link" href="./prode.html"><span data-icon="trophy"></span>Prode</a>
      <a class="nav-link caja-only" href="./caja.html" hidden><span data-icon="cash"></span>Caja</a>
      <a class="nav-link admin-only" href="./sala-admin.html" hidden><span data-icon="shield"></span>Admin</a>
    </nav>

    <!-- MODAL DE VIDEO -->
    <div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-labelledby="vm-title">
      <div class="modal-box">
        <div class="modal-head">
          <div><h3 id="vm-title"></h3><p id="vm-sub"></p></div>
          <button class="btn-icon" id="vm-close" type="button" aria-label="Cerrar" data-icon="close"></button>
        </div>
        <div class="modal-frame"><iframe id="vm-frame" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      </div>
    </div>

    <script type="module" src="./sala/js/sala.js"></script>
  </body>
</html>
